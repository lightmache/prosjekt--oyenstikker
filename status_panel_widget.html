<div id="status-panel" style="position:fixed;bottom:10px;right:10px;background:#1e1e1e;color:#0f0;font-family:monospace;font-size:11px;padding:10px;border:1px solid #333;border-radius:6px;max-width:300px;z-index:9999;">
  <div style="cursor:pointer;font-weight:bold;" onclick="document.getElementById('status-body').style.display = document.getElementById('status-body').style.display === 'none' ? 'block' : 'none';">⚙ System Status</div>
  <div id="status-body"></div>
</div>
<script>
async function refreshStatusPanel() {
  try {
    const res = await fetch('http://localhost:8001/status');
    const data = await res.json();
    let html = `Docs: ${data.documents.total_documents} (apps: ${data.documents.application_documents})<br>`;
    data.services.forEach(s => {
      html += `${s.status === 'up' ? '✓' : '✗'} ${s.name}<br>`;
    });
    for (const [repo, info] of Object.entries(data.repos)) {
      html += `${repo}: ${info.branch} ${info.dirty ? '(dirty)' : '(clean)'}<br>`;
    }
    document.getElementById('status-body').innerHTML = html;
  } catch (e) {
    document.getElementById('status-body').innerHTML = 'status_panel.py not reachable';
  }
}
refreshStatusPanel();
setInterval(refreshStatusPanel, 10000);
</script>
