<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>prosjekt-oyenstikker data flow</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- INGEST PATH label -->
<text x="40" y="44" font-family="monospace" font-size="11" font-weight="500" fill="#5F5E5A">INGEST PATH</text>
<line x1="40" y1="50" x2="640" y2="50" stroke="#D3D1C7" stroke-width="0.5"/>

<!-- EPA CSV -->
<rect x="40" y="64" width="120" height="52" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="100" y="86" font-family="monospace" font-size="11" font-weight="500" fill="#412402" text-anchor="middle">EPA CSV</text>
<text x="100" y="102" font-family="monospace" font-size="10" fill="#633806" text-anchor="middle">vinton_sample</text>
<text x="100" y="114" font-family="monospace" font-size="10" fill="#633806" text-anchor="middle">2024-01-01.csv</text>

<line x1="160" y1="90" x2="188" y2="90" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- ingest_vinton.py -->
<rect x="190" y="64" width="130" height="52" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="255" y="86" font-family="monospace" font-size="11" font-weight="500" fill="#412402" text-anchor="middle">ingest_vinton.py</text>
<text x="255" y="102" font-family="monospace" font-size="10" fill="#633806" text-anchor="middle">parse · clean</text>
<text x="255" y="114" font-family="monospace" font-size="10" fill="#633806" text-anchor="middle">POST /ingest</text>

<line x1="320" y1="90" x2="348" y2="90" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- sentence-transformers ingest -->
<rect x="350" y="64" width="140" height="52" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="420" y="86" font-family="monospace" font-size="11" font-weight="500" fill="#4A1B0C" text-anchor="middle">sentence-transformers</text>
<text x="420" y="102" font-family="monospace" font-size="10" fill="#712B13" text-anchor="middle">text → 384-dim</text>
<text x="420" y="114" font-family="monospace" font-size="10" fill="#712B13" text-anchor="middle">embedding vector</text>

<line x1="490" y1="90" x2="518" y2="90" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- pgvector store -->
<rect x="520" y="64" width="120" height="52" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="580" y="86" font-family="monospace" font-size="11" font-weight="500" fill="#085041" text-anchor="middle">pgvector</text>
<text x="580" y="102" font-family="monospace" font-size="10" fill="#0F6E56" text-anchor="middle">store content</text>
<text x="580" y="114" font-family="monospace" font-size="10" fill="#0F6E56" text-anchor="middle">+ embedding</text>

<!-- QUERY PATH label -->
<text x="40" y="174" font-family="monospace" font-size="11" font-weight="500" fill="#5F5E5A">QUERY PATH</text>
<line x1="40" y1="180" x2="640" y2="180" stroke="#D3D1C7" stroke-width="0.5"/>

<!-- user query -->
<rect x="40" y="194" width="120" height="52" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="100" y="216" font-family="monospace" font-size="11" font-weight="500" fill="#26215C" text-anchor="middle">user query</text>
<text x="100" y="232" font-family="monospace" font-size="10" fill="#3C3489" text-anchor="middle">POST /ask</text>
<text x="100" y="244" font-family="monospace" font-size="10" fill="#3C3489" text-anchor="middle">X-API-Key</text>

<line x1="160" y1="220" x2="188" y2="220" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- embed query -->
<rect x="190" y="194" width="130" height="52" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="255" y="216" font-family="monospace" font-size="11" font-weight="500" fill="#4A1B0C" text-anchor="middle">sentence-transformers</text>
<text x="255" y="232" font-family="monospace" font-size="10" fill="#712B13" text-anchor="middle">embed query</text>
<text x="255" y="244" font-family="monospace" font-size="10" fill="#712B13" text-anchor="middle">→ vector</text>

<line x1="320" y1="220" x2="348" y2="220" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- similarity search -->
<rect x="350" y="194" width="140" height="52" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="420" y="216" font-family="monospace" font-size="11" font-weight="500" fill="#085041" text-anchor="middle">pgvector</text>
<text x="420" y="232" font-family="monospace" font-size="10" fill="#0F6E56" text-anchor="middle">cosine similarity</text>
<text x="420" y="244" font-family="monospace" font-size="10" fill="#0F6E56" text-anchor="middle">top 3 chunks</text>

<line x1="490" y1="220" x2="518" y2="220" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Ollama -->
<rect x="520" y="194" width="120" height="52" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<text x="580" y="216" font-family="monospace" font-size="11" font-weight="500" fill="#173404" text-anchor="middle">Ollama</text>
<text x="580" y="232" font-family="monospace" font-size="10" fill="#27500A" text-anchor="middle">context + query</text>
<text x="580" y="244" font-family="monospace" font-size="10" fill="#27500A" text-anchor="middle">→ prompt</text>

<!-- response arrow back -->
<path d="M580 246 L580 290 L100 290 L100 248" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="340" y="308" font-family="monospace" font-size="10" fill="#5F5E5A" text-anchor="middle">grounded response returned to client</text>

<!-- CONVERSATION MODE label -->
<text x="40" y="344" font-family="monospace" font-size="11" font-weight="500" fill="#5F5E5A">CONVERSATION MODE</text>
<line x1="40" y1="350" x2="640" y2="350" stroke="#D3D1C7" stroke-width="0.5"/>

<!-- conversation trigger -->
<rect x="40" y="364" width="160" height="52" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="120" y="386" font-family="monospace" font-size="11" font-weight="500" fill="#26215C" text-anchor="middle">trigger detected</text>
<text x="120" y="402" font-family="monospace" font-size="10" fill="#3C3489" text-anchor="middle">"we discussed"</text>
<text x="120" y="414" font-family="monospace" font-size="10" fill="#3C3489" text-anchor="middle">"you said" etc</text>

<line x1="200" y1="390" x2="228" y2="390" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- session history -->
<rect x="230" y="364" width="160" height="52" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="310" y="386" font-family="monospace" font-size="11" font-weight="500" fill="#26215C" text-anchor="middle">session history</text>
<text x="310" y="402" font-family="monospace" font-size="10" fill="#3C3489" text-anchor="middle">last 12 messages</text>
<text x="310" y="414" font-family="monospace" font-size="10" fill="#3C3489" text-anchor="middle">skip KB retrieval</text>

<line x1="390" y1="390" x2="418" y2="390" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Ollama conv -->
<rect x="420" y="364" width="120" height="52" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<text x="480" y="386" font-family="monospace" font-size="11" font-weight="500" fill="#173404" text-anchor="middle">Ollama</text>
<text x="480" y="402" font-family="monospace" font-size="10" fill="#27500A" text-anchor="middle">history-only</text>
<text x="480" y="414" font-family="monospace" font-size="10" fill="#27500A" text-anchor="middle">prompt</text>

<!-- session save -->
<rect x="40" y="444" width="500" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="290" y="466" font-family="monospace" font-size="11" fill="#2C2C2A" text-anchor="middle">session persisted to /sessions/{id}.json · resumable across restarts</text>

</svg>
